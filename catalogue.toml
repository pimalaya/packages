# The CLIs the hub packages and the channels each ships to (apt, dnf,
# homebrew). Only stable releases ship: tagged X.Y.Z with X of 1 or more, no
# pre-release, and declaring license in the Cargo.toml of their tag, whose
# license-files the packages carry. keep is the number of them the APT and DNF
# repositories hold per CLI, highest versions first. revision is the package
# release number (ortie_2.3.0-1): bump it to rebuild every published package.

keep = 3
revision = 1
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]

[cli.ortie]
repository = "pimalaya/ortie"
description = "CLI to manage OAuth tokens"
channels = ["apt", "dnf", "homebrew"]

[cli.himalaya]
repository = "pimalaya/himalaya"
description = "CLI to manage emails"
channels = ["apt", "dnf"]
